<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>圖解單字</title>
<style>
  :root{--bg:#f7f3e8;--ink:#1b3a2f;--soft:#5b6b60;--gold:#e8b94a;--card:#fffdf6;--line:#e3d9bd;--ok:#2e7d4f;--bad:#b3382c;--box:#efe8d2}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.55}
  .wrap{max-width:900px;margin:0 auto;padding:16px 16px 110px}
  .crumb{font-size:14px;margin-bottom:6px}.crumb a{color:var(--soft);text-decoration:none}
  h1{margin:4px 0 2px;font-size:28px}
  .sub{color:var(--soft);font-size:15px;margin-bottom:14px}
  .grp{background:var(--box);border:1px solid var(--line);border-radius:22px;padding:8px 12px 6px;margin-bottom:10px}
  .grp .lbl{font-size:12px;font-weight:800;letter-spacing:.18em;color:#9a6b12;margin:0 0 4px 4px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tab{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;font-size:15px;font-weight:700;cursor:pointer}
  .tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .tab small{opacity:.7;font-weight:400;margin-left:4px}
  .words{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:14px}
  .wc{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px}
  .wc .em{font-size:46px;line-height:1.1}
  .wc .en{font-size:21px;font-weight:800;margin-top:4px}
  .wc .pos{color:var(--soft);font-size:13px;font-weight:600;margin-left:6px}
  .wc .zh{font-size:17px;margin:2px 0 8px}
  .wc .ex{font-size:14px;color:var(--soft);border-top:1px dashed var(--line);padding-top:8px}
  .wc .ex b{color:var(--ink);font-weight:600}
  .sp{border:0;background:var(--gold);border-radius:999px;width:34px;height:34px;font-size:16px;cursor:pointer;vertical-align:middle;margin-left:6px}
  .sp.sm{width:28px;height:28px;font-size:13px}
  .scene{display:block;width:100%;max-width:760px;margin:12px auto 0;border:1.5px solid var(--line);border-radius:18px;background:#fff}
  .dot{cursor:pointer}.dot circle{fill:#1b3a2f;stroke:#fff;stroke-width:1.5}.dot text{fill:#fff;font-size:9px;font-weight:800;text-anchor:middle}
  .dot.on circle{fill:#e8b94a;stroke:#1b3a2f}.dot.on text{fill:#1b3a2f}
  .swl{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:12px}
  .sw{display:flex;gap:8px;align-items:baseline;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;cursor:pointer;text-align:left;font:inherit;color:var(--ink)}
  .sw b{background:var(--ink);color:#fff;border-radius:999px;min-width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;flex:none}
  .sw .en{font-weight:800}.sw .zh{color:var(--soft);font-size:14px}.sw.on{border-color:var(--gold);background:#fff3d6}
  .ctl{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
  .chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink)}
  .chip.on{background:var(--gold);border-color:var(--gold)}
  .hide-zh .zh,.hide-zh .exzh,.hide-zh .dzh{visibility:hidden}
  .hide-en .en,.hide-en .exen,.hide-en .den{visibility:hidden}
  .dl{margin-top:14px;display:flex;flex-direction:column;gap:10px}
  .ln{display:flex;gap:10px;align-items:flex-start}
  .ln.me{flex-direction:row-reverse}
  .av{font-size:30px;line-height:1}
  .bub{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:8px 12px;max-width:min(560px,82%)}
  .ln.me .bub{background:#fff3d6;border-color:var(--gold)}
  .ln.playing .bub{box-shadow:0 0 0 3px var(--gold);background:#fff8e6}
  .chip.play-all{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}
  .nm{font-size:12px;color:var(--soft);font-weight:700}
  .den{font-size:16px;font-weight:600}.dzh{font-size:14px;color:var(--soft)}
  .dl b.hl{background:#ffe9a8;border-radius:4px;padding:0 2px;font-weight:700}
  .q{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;margin:12px 0}
  .q .qn{font-weight:800;color:var(--soft);margin-right:6px}
  .q .qt{font-size:17px;font-weight:600}
  .q .big{font-size:42px;vertical-align:middle;margin-right:8px}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  @media(max-width:520px){.opts{grid-template-columns:1fr}}
  .opt{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;font-size:16px;cursor:pointer;text-align:left;color:var(--ink)}
  .opt.sel{border-color:var(--ink);background:#e9efe9;font-weight:700}
  .opt.ok{border-color:var(--ok);background:#dff2e5}.opt.bad{border-color:var(--bad);background:#f8dedb}
  .opt:disabled{cursor:default}
  input.sp-in{font-size:18px;padding:8px 12px;border:1.5px solid var(--line);border-radius:12px;width:min(320px,100%);margin-top:8px}
  input.sp-in.ok{border-color:var(--ok);background:#dff2e5}input.sp-in.bad{border-color:var(--bad);background:#f8dedb}
  .fb{font-size:14px;margin-top:6px;color:var(--ok);font-weight:700}
  .fb.bad{color:var(--bad)}
  .sub-bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:16px 0}
  .go{background:var(--ink);color:#fff;border:0;border-radius:12px;padding:12px 24px;font-size:17px;font-weight:800;cursor:pointer}
  .go:disabled{opacity:.55;cursor:not-allowed}
  .st{font-size:14px;color:var(--soft)}
  #who{font-size:13px;color:var(--soft);margin:2px 0 10px}
  .q.fixing{border-left:5px solid #e0a020;background:#fffaf0}
  .q.fixing .qt::before{content:'✏️ 訂正 ';color:#b5761a;font-weight:800}
  .fixbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0;padding:10px 14px;border-radius:14px;background:#fff4dc;border:2px solid #e7c98a;font-size:14.5px;color:#6b4a12}
  .fixbar b{color:#c0392b}.fixbar.done{background:#e8f5ec;border-color:#9ccfab;color:#1f6b3a}.fixbar.done b{color:#1f6b3a}
  .fixbar button{background:#c0392b;color:#fff;border:0;border-radius:999px;padding:9px 18px;font-size:15px;font-weight:800;cursor:pointer}
  .fixbar button[disabled]{background:#d8cdb4;color:#7a6a48;cursor:default}
  .fixbar button.exit{background:#fff;color:#5a4a2a;border:1.5px solid #c9b88f}
  .fixbar a.exit-link{display:inline-block;padding:7px 14px;border-radius:999px;background:#2f6fb5;color:#fff;font-weight:800;text-decoration:none}
  .ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:10px 16px;font-size:15px;font-weight:700;cursor:pointer}
  .note{font-size:12.5px;color:var(--soft);margin-top:26px;border-top:1px solid var(--line);padding-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="crumb"><a href="index.html">← 圖解單字</a></div>
  <h1 id="h1">載入中…</h1>
  <div class="sub" id="sub"></div>
  <div id="who"></div>
  <div class="grp"><div class="lbl">學習</div><div class="tabs" id="tabsL"></div></div>
  <div class="grp"><div class="lbl">測驗</div><div class="tabs" id="tabsQ"></div></div>
  <div id="view"></div>
  <div class="note">單字清單依生活常見用字整理；中文解釋、例句、對話與語音都是自己編寫與合成；圖示為示意 emoji，僅供聯想。</div>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tid = new URLSearchParams(location.search).get('t') || 'home-1';
const SYNC_URL = 'https://script.google.com/macros/s/AKfycbwqd9cr_3MfXK8hzs8Y-YPQQUqOH5vKtW_vMav1nMAAt9VkBCP_5WP6Q1TDngIlr51U/exec';

function get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function student(){ const n = String(get('quizStudentName') || '').trim(); return (!n || /^訪客/.test(n)) ? '' : n; }

// ---- 語音 ----
let cur = null;
function speakFallback(text, onend){   // 還沒產生語音檔時，改用瀏覽器內建語音
  try{ if(!text) return onend && onend(); const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; u.rate = 0.9; if(onend) u.onend = onend; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){ onend && onend(); }
}
function play(src, text, onend){
  if(cur){ try{ cur.pause(); }catch(e){} cur = null; }
  try{ speechSynthesis.cancel(); }catch(e){}
  const a = new Audio(src); cur = a;
  if(onend) a.onended = onend;
  a.onerror = () => { if(cur !== a) return; cur = null; speakFallback(text, onend); };
  a.play().catch(()=>{});
}

// ---- 情境對話「全部播放」：一句接一句播，正在播的那句會標出來 ----
let seqId = 0;   // 每次開始／停止都換號，舊的回呼就不再接下去
function stopAll(){
  if(!seqId) return;
  seqId = 0;
  if(cur){ try{ cur.pause(); }catch(e){} cur = null; }
  try{ speechSynthesis.cancel(); }catch(e){}
  document.querySelectorAll('.ln.playing').forEach(x => x.classList.remove('playing'));
  const b = $('#playAll'); if(b) b.textContent = '▶ 全部播放';
}
function playAll(){
  if(seqId) return stopAll();
  const id = seqId = Date.now();
  const b = $('#playAll'); if(b) b.textContent = '⏹ 停止播放';
  const step = i => {
    if(seqId !== id) return;
    const lines = document.querySelectorAll('.dl .ln');
    lines.forEach((x, k) => x.classList.toggle('playing', k === i));
    if(i >= lines.length) return stopAll();
    lines[i].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    const sp = lines[i].querySelector('[data-au]');
    play(sp.dataset.au, sp.dataset.tx, () => setTimeout(() => step(i + 1), 350));
  };
  step(0);
}

// ---- 固定種子亂數，讓同一個主題每次出的題目一樣 ----
function rng(seed){ let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(arr, r){ const a = arr.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function hash(s){ let h = 2166136261; for(const c of s){ h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

let T, A = '', tab = 'cards', hideZh = false, hideEn = false;
const QZ = {};   // 各測驗：{ qs, answers, sent, score, name }
const QUIZ_DEF = [
  { id: 'pic', name: '看圖選字', desc: '看圖和中文，選出英文單字' },
  { id: 'listen', name: '聽音選字', desc: '聽發音，選出英文單字' },
  { id: 'spell', name: '拼字', desc: '看圖和中文，拼出英文單字' },
];

function buildQuizzes(){
  const N = Math.min(10, T.words.length);
  QUIZ_DEF.forEach(def => {
    const r = rng(hash(tid + def.id));
    const pick = shuffle(T.words, r).slice(0, N);
    const qs = pick.map(w => {
      const q = { w };
      if(def.id !== 'spell'){
        const others = shuffle(T.words.filter(x => x !== w), r).slice(0, 3);
        q.opts = shuffle([w].concat(others), r).map(x => x.w);
      }
      return q;
    });
    QZ[def.id] = { def, qs, answers: new Array(qs.length).fill(''), sent: false, score: null, status: 'open', round: 0, fixing: new Set(), pending: false };
  });
}

function renderTabs(){
  const mk = (id, name, extra) => `<button class="tab${tab === id ? ' on' : ''}" data-tab="${id}">${name}${extra || ''}</button>`;
  $('#tabsL').innerHTML = (T.scene ? mk('scene', '🗺️ 場景圖') : '') + mk('cards', '🔤 圖解單字', `<small>${T.words.length}</small>`) + mk('dialogue', '💬 情境對話');
  $('#tabsQ').innerHTML = QUIZ_DEF.map(d => mk(d.id, d.name, QZ[d.id].sent ? '<small>✓</small>' : '')).join('');
}
document.addEventListener('click', e => {
  const t = e.target.closest('.tab');
  if(t){ stopAll(); tab = t.dataset.tab; renderTabs(); renderView(); return; }
  if(e.target.closest('#playAll')){ playAll(); return; }
  const sp = e.target.closest('[data-au]');
  if(sp){ stopAll(); play(sp.dataset.au, sp.dataset.tx); return; }
});

function renderView(){
  if(tab === 'scene') return drawScene();
  if(tab === 'cards') return drawCards();
  if(tab === 'dialogue') return drawDialogue();
  drawQuiz(tab);
}

// 場景圖：圖上的編號圓點對應下方的單字清單；點圓點或點單字都會發音並標出位置
function drawScene(){
  const S = T.scene;
  const dots = T.words.map((w, i) => {
    const p = S.pos[w.slug], em = p[2] === 'e';
    const icon = em ? `<text x="${p[0] - 11}" y="${p[1] + 8}" font-size="22">${w.emoji}</text>` : '';
    // 編號放在 emoji 左邊（太靠左就放右邊），不蓋住圖
    const bx = em ? (p[0] - 22 < 9 ? p[0] + 22 : p[0] - 22) : p[0], by = em ? p[1] - 3 : p[1];
    return icon + `<g class="dot" data-n="${i}" transform="translate(${bx} ${by})"><circle r="8.5"/><text y="3.5">${i + 1}</text></g>`;
  }).join('');
  const list = T.words.map((w, i) => `<button class="sw" data-n="${i}"><b>${i + 1}</b><span class="en">${esc(w.w)}</span><span class="zh">${esc(w.zh)}</span></button>`).join('');
  $('#view').innerHTML = ctlBar() + `<svg class="scene" viewBox="0 0 400 ${S.h || 250}" role="img" aria-label="${esc(T.title)}場景圖">${S.svg}${dots}</svg><div class="swl ${cls()}">${list}</div>`;
}
document.addEventListener('click', e => {
  const t = e.target.closest('.dot, .sw'); if(!t || tab !== 'scene') return;
  const i = +t.dataset.n, w = T.words[i];
  document.querySelectorAll('.dot').forEach(d => d.classList.toggle('on', +d.dataset.n === i));
  document.querySelectorAll('.sw').forEach(d => d.classList.toggle('on', +d.dataset.n === i));
  play(au('w', w), w.w);
});

function au(kind, w){ return `audio/${T.id}/${kind}-${w.slug}.mp3`; }
function cls(){ return (hideZh ? 'hide-zh ' : '') + (hideEn ? 'hide-en' : ''); }
function ctlBar(extra){
  return `<div class="ctl">${extra || ''}<button class="chip${hideZh ? ' on' : ''}" data-ctl="zh">遮住中文</button><button class="chip${hideEn ? ' on' : ''}" data-ctl="en">遮住英文</button></div>`;
}
document.addEventListener('click', e => {
  const c = e.target.closest('[data-ctl]'); if(!c) return;
  if(c.dataset.ctl === 'zh') hideZh = !hideZh; else hideEn = !hideEn;
  renderView();
});

function drawCards(){
  $('#view').innerHTML = ctlBar() + `<div class="words ${cls()}">` + T.words.map(w => `
    <div class="wc"><div class="em">${w.emoji}</div>
      <div><span class="en">${esc(w.w)}</span><span class="pos">${esc(w.pos)}</span><button class="sp" data-au="${au('w', w)}" data-tx="${esc(w.w)}" aria-label="聽發音">🔊</button></div>
      <div class="zh">${esc(w.zh)}</div>
      <div class="ex"><span class="exen">${esc(w.ex)}</span><button class="sp sm" data-au="${au('e', w)}" data-tx="${esc(w.ex)}" aria-label="聽例句">🔊</button><div class="exzh">${esc(w.exzh)}</div></div>
    </div>`).join('') + '</div>';
}

function hl(text){
  let h = esc(text);
  T.words.map(w => w.w).sort((a, b) => b.length - a.length).forEach(w => {
    const re = new RegExp('\\b(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?:es|s)?)\\b', 'gi');
    h = h.replace(re, '<b class="hl">$1</b>');
  });
  return h;
}
function drawDialogue(){
  const sp = T.speakers;
  $('#view').innerHTML = `<h2 style="margin:16px 0 0;font-size:18px">${esc(T.dialogueTitle)}</h2>` + ctlBar(`<button class="chip play-all" id="playAll">${seqId ? "⏹ 停止播放" : "▶ 全部播放"}</button>`) + `<div class="dl ${cls()}">` + T.dialogue.map((l, i) => {
    const s = sp[l.s], me = l.s === 'M';
    return `<div class="ln${me ? ' me' : ''}"><div class="av">${s.avatar}</div><div class="bub"><div class="nm">${esc(s.name)}（${esc(s.zh)}）</div>
      <div><span class="den">${hl(l.en)}</span><button class="sp sm" data-au="audio/${T.id}/d-${String(i + 1).padStart(2, '0')}.mp3" data-tx="${esc(l.en)}" aria-label="聽這句">🔊</button></div>
      <div class="dzh">${esc(l.zh)}</div></div></div>`;
  }).join('') + '</div>';
}

// ---------- 測驗 ----------
function norm(s){ return String(s || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }
// 測驗規則（和段考題庫一致，使用者 2026-10-18）：
// 送出成績 → 自動對答案（答對綠、答錯紅，標出正解）→ 有錯題時上方「✏️ 訂正錯誤」：答對的題目鎖住、錯題清空重答 →「送出訂正」再對答案，
// 直到全對；全部訂正完成補送 1 點（Points.earn kind:'fix-bonus'）。還有錯題沒訂正完不能離開這一頁（測試帳號 TEST、家長可「立即離開」）。
// 點數只算第一次作答；試算表每次訂正記一筆，mode 加「【第 N 次訂正】」，全部訂正完成另記「【全部訂正完成】補送 1 點」。
// 做到一半可「💾 暫存」（作答時也自動暫存），下次打開同一個主題自動接續。z.status：open 作答中、graded 已對答案、fixing 訂正中。
function locked(z, i){ return z.status === 'graded' || (z.status === 'fixing' && !z.fixing.has(i)); }
function canSkipFix(){ const n = student().toUpperCase(); return n === 'TEST' || n === 'PARENT'; }
function wrongIdx(id){ const z = QZ[id]; return z.qs.map((q, i) => i).filter(i => !isRight(id, z.qs[i], z.answers[i])); }
function anyPending(){ return QUIZ_DEF.some(d => QZ[d.id].pending); }
function fixBarHtml(id){
  const z = QZ[id];
  if(z.skipped) return '<div class="fixbar done">🚪 已解除訂正限制（測試／家長帳號），可以離開：<a class="exit-link" href="index.html">↩ 回圖解單字目錄</a><a class="exit-link" href="https://jenlin2002.github.io/">🏠 回主頁面</a></div>';
  const exit = canSkipFix() ? '<button type="button" class="exit" data-exit>🚪 立即離開</button>' : '';
  if(z.status === 'fixing') return `<div class="fixbar"><button type="button" disabled>✏️ 第 ${z.round} 次訂正中</button><span>把 <b>${z.fixing.size} 題</b>黃色框的題目重新作答，完成後按下方「送出訂正」。錯題全部訂正完畢再另加補送 <b>1 點</b>。</span>${exit}</div>`;
  if(z.status === 'graded' && z.pending) return `<div class="fixbar"><button type="button" data-fix>✏️ 訂正錯誤</button><span>還有 <b>${wrongIdx(id).length} 題</b>錯誤（紅色）。按「訂正錯誤」重新作答，<b>錯誤全部訂正完畢再另加補送 1 點</b>；訂正完才能離開這一頁。</span>${exit}</div>`;
  if(z.status === 'graded' && z.round > 0) return `<div class="fixbar done">🎉 錯題全部訂正完成（訂正 ${z.round} 次）！補送 <b>1 點</b>。</div>`;
  return '';
}
function drawQuiz(id){
  const z = QZ[id], def = z.def;
  const body = z.qs.map((q, i) => {
    const w = q.w, a = z.answers[i], dis = locked(z, i) ? ' disabled' : '';
    let head, inner;
    if(id === 'pic'){
      head = `<span class="big">${w.emoji}</span><span class="qt">${esc(w.zh)}</span>`;
    } else if(id === 'listen'){
      head = `<button class="sp" data-au="${au('w', w)}" data-tx="${esc(w.w)}">🔊</button><span class="qt"> 聽發音，選出你聽到的單字</span>`;
    } else {
      head = `<span class="big">${w.emoji}</span><span class="qt">${esc(w.zh)}</span><button class="sp" data-au="${au('w', w)}" data-tx="${esc(w.w)}" title="聽發音">🔊</button><div class="st">共 ${w.w.replace(/[^A-Za-z]/g, '').length} 個字母</div>`;
    }
    if(id === 'spell'){
      inner = `<input class="sp-in" data-i="${i}" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="輸入英文" value="${esc(a)}"${dis}>`;
    } else {
      inner = `<div class="opts">` + q.opts.map(o => `<button class="opt${a === o ? ' sel' : ''}" data-i="${i}" data-o="${esc(o)}"${dis}>${esc(o)}</button>`).join('') + '</div>';
    }
    const fx = z.status === 'fixing' && z.fixing.has(i) ? ' fixing' : '';
    return `<div class="q${fx}" id="q${i}"><div><span class="qn">${i + 1}.</span>${head}</div>${inner}<div class="fb" id="fb${i}"></div></div>`;
  }).join('');
  const btn = z.status === 'open' ? '送出成績' : z.status === 'fixing' ? '送出訂正'
    : '已送出成績（' + z.score + ' / ' + z.qs.length + '）' + (z.round ? '・已訂正' : '');
  const draft = z.status === 'open' ? `<button type="button" class="ghost" id="draftSave">💾 暫存</button>` : '';
  $('#view').innerHTML = `<h2 style="margin:16px 0 0;font-size:18px">${def.name}　<small style="color:var(--soft);font-weight:400">${def.desc}，共 ${z.qs.length} 題</small></h2>` + fixBarHtml(id) + body +
    `<div class="sub-bar"><button class="go" id="go"${z.status === 'graded' ? ' disabled' : ''}>${btn}</button>${draft}<span class="st" id="st">${z.status === 'open' ? esc(draftMsg) : ''}</span></div>`;
  if(z.status !== 'open') markResult(id);
}
document.addEventListener('click', e => {
  const o = e.target.closest('.opt'); if(!o || o.disabled) return;
  const z = QZ[tab]; if(!z) return;
  const i = +o.dataset.i; if(locked(z, i)) return;
  z.answers[i] = o.dataset.o;
  document.querySelectorAll(`#q${i} .opt`).forEach(b => b.classList.toggle('sel', b === o));
  autoSave();
});
document.addEventListener('input', e => {
  const t = e.target.closest('.sp-in'); if(!t) return;
  const z = QZ[tab]; if(!z || locked(z, +t.dataset.i)) return;
  z.answers[+t.dataset.i] = t.value;
  autoSave();
});

function isRight(id, q, a){ return id === 'spell' ? norm(a) === norm(q.w.w) : a === q.w.w; }
function markResult(id){
  const z = QZ[id];
  z.qs.forEach((q, i) => {
    if(z.status === 'fixing' && z.fixing.has(i)) return;   // 訂正中的題目先不顯示正解
    const a = z.answers[i], ok = isRight(id, q, a), fb = $('#fb' + i);
    if(id === 'spell'){
      const inp = document.querySelector(`#q${i} .sp-in`); inp.classList.add(ok ? 'ok' : 'bad');
    } else {
      document.querySelectorAll(`#q${i} .opt`).forEach(b => { if(b.dataset.o === q.w.w) b.classList.add('ok'); else if(b.dataset.o === a) b.classList.add('bad'); });
    }
    if(fb){ fb.className = 'fb' + (ok ? '' : ' bad'); fb.textContent = ok ? '✓ 答對了' : '✕ 你的答案：' + (a || '（空白）') + '　正確答案：' + q.w.w + '（' + q.w.zh + '）'; }
  });
}

function postSheet(body){
  return fetch(get('quizSyncUrl') || SYNC_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) }).catch(() => {});
}
function quizLabel(){ return 'Vocab｜' + T.title + ' ' + T.titleEn; }
document.addEventListener('click', e => {
  if(e.target.closest('[data-exit]')){
    QUIZ_DEF.forEach(d => { const z = QZ[d.id]; if(z.pending || z.status === 'fixing'){ z.pending = false; z.skipped = true; if(z.status === 'fixing') z.status = 'graded'; } });
    QZ[tab].skipped = true; drawQuiz(tab); return;
  }
  if(!e.target.closest('[data-fix]')) return;
  const id = tab, z = QZ[id]; if(!z || !z.pending) return;
  z.round++; z.fixing = new Set(wrongIdx(id)); z.fixing.forEach(i => { z.answers[i] = ''; });
  z.status = 'fixing'; drawQuiz(id);
  const first = document.querySelector('.q.fixing'); if(first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
});
// 還有錯題沒訂正完：擋住離開這一頁的連結；關分頁／重新整理跳出確認
document.addEventListener('click', e => {
  if(!anyPending()) return;
  const a = e.target.closest('a[href]'); if(!a || a.getAttribute('href').charAt(0) === '#') return;
  e.preventDefault(); e.stopImmediatePropagation();
  const names = QUIZ_DEF.filter(d => QZ[d.id].pending).map(d => d.name).join('、');
  alert('「' + names + '」還有錯題，先按「訂正錯誤」訂正完才能離開喔！');
}, true);
window.addEventListener('beforeunload', e => { if(anyPending()){ e.preventDefault(); e.returnValue = ''; } });

document.addEventListener('click', async e => {
  if(!e.target.closest('#go')) return;
  const id = tab, z = QZ[id]; if(!z || z.status === 'graded') return;
  const name = student();
  if(!name){ alert('請先登入（在「你是誰？」選名字並輸入 PIN），成績才會記在你的名下'); return; }
  const label = quizLabel();
  if(z.status === 'fixing'){
    const idx = Array.from(z.fixing);
    const left = idx.filter(i => !String(z.answers[i]).trim()).length;
    if(left){ alert('還有 ' + left + ' 題訂正的題目沒作答'); return; }
    const okN = idx.filter(i => isRight(id, z.qs[i], z.answers[i])).length;
    if(name !== 'PARENT'){
      const details = idx.map(i => ({ q: z.qs[i].w.zh, picked: z.answers[i], correct: z.qs[i].w.w, isCorrect: isRight(id, z.qs[i], z.answers[i]) }));
      postSheet({ name, week: label, mode: z.def.name + '【第 ' + z.round + ' 次訂正】', score: okN, total: idx.length, percent: Math.round(okN / idx.length * 100), details });
    }
    z.status = 'graded'; z.fixing = new Set();
    z.pending = wrongIdx(id).length > 0;
    if(!z.pending){
      if(name !== 'PARENT') postSheet({ name, week: label, mode: z.def.name + '【全部訂正完成】補送 1 點', score: 1, total: 1, percent: 100,
        details: [{ q: '錯題全部訂正完成（共訂正 ' + z.round + ' 次）', picked: '', correct: '', isCorrect: true }] });
      if(window.Points){ try{ Points.earn({ name, label: label + '・' + z.def.name, mode: '訂正完成', kind: 'fix-bonus', correct: 1, total: 1 }); }catch(err){} }
    }
    renderTabs(); drawQuiz(id); window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  const left = z.answers.filter(a => !String(a).trim()).length;
  if(left){ alert('「' + z.def.name + '」還有 ' + left + ' 題沒作答，請先完成再送出成績'); return; }
  z.sent = true; z.status = 'graded';
  z.score = z.qs.filter((q, i) => isRight(id, q, z.answers[i])).length;
  z.pending = z.score < z.qs.length;
  clearDraft(id);
  renderTabs(); drawQuiz(id); window.scrollTo({ top: 0, behavior: 'smooth' });
  if(window.Points){ try{ Points.earn({ name, label, mode: z.def.name, correct: z.score, total: z.qs.length }); }catch(err){} }
  if(name !== 'PARENT'){
    const details = z.qs.map((q, i) => ({ q: q.w.zh, picked: z.answers[i], correct: q.w.w, isCorrect: isRight(id, q, z.answers[i]) }));
    await postSheet({ name, week: label, mode: z.def.name, score: z.score, total: z.qs.length, percent: Math.round(z.score / z.qs.length * 100), details });
  }
  const todo = QUIZ_DEF.filter(d => !QZ[d.id].sent).map(d => {
    const n = QZ[d.id].answers.filter(a => !String(a).trim()).length;
    return n ? d.name + '還有 ' + n + ' 題沒作答' : d.name + '已作答完，還沒按「送出成績」';
  });
  let msg = '「' + z.def.name + '」已送出成績：' + z.score + ' / ' + z.qs.length + ' 題答對（畫面已標出正確答案）。';
  if(z.pending) msg += '\n\n有 ' + (z.qs.length - z.score) + ' 題錯了，按上方「✏️ 訂正錯誤」訂正，全部訂正完再補送 1 點！';
  msg += todo.length ? '\n\n還有測驗沒完成：\n' + todo.join('\n') : '\n\n三個測驗都送出了，太棒了！';
  setTimeout(() => alert(msg), 50);
});

// ---- 暫存：作答中的答案存在這台裝置（localStorage vocabDraft:主題:登入者），下次打開同一個主題自動接續 ----
let draftMsg = '', draftTimer = 0;
function draftKey(){ return 'vocabDraft:' + tid + ':' + (student() || '-'); }
function readDraft(){ try{ return JSON.parse(localStorage.getItem(draftKey()) || '{}') || {}; }catch(e){ return {}; } }
function saveDraft(manual){
  const d = {};
  QUIZ_DEF.forEach(def => { const z = QZ[def.id]; if(z.status === 'open' && z.answers.some(a => String(a).trim())) d[def.id] = z.answers; });
  try{
    if(Object.keys(d).length){ d.t = Date.now(); localStorage.setItem(draftKey(), JSON.stringify(d)); } else localStorage.removeItem(draftKey());
  }catch(e){ if(manual) alert('這台裝置無法暫存（瀏覽器不允許）'); return; }
  const tm = new Date(); draftMsg = (manual ? '✅ 已暫存' : '已自動暫存') + '（' + String(tm.getHours()).padStart(2, '0') + ':' + String(tm.getMinutes()).padStart(2, '0') + '），下次打開這個主題會自動接續。';
  const st = $('#st'); if(st && QZ[tab] && QZ[tab].status === 'open') st.textContent = draftMsg;
}
function autoSave(){ clearTimeout(draftTimer); draftTimer = setTimeout(() => saveDraft(false), 600); }
function clearDraft(id){
  const d = readDraft(); delete d[id];
  try{ if(QUIZ_DEF.some(def => d[def.id])) localStorage.setItem(draftKey(), JSON.stringify(d)); else localStorage.removeItem(draftKey()); }catch(e){}
  draftMsg = '';
}
function restoreDraft(){
  const d = readDraft(); let n = 0;
  QUIZ_DEF.forEach(def => {
    const a = d[def.id], z = QZ[def.id];
    if(Array.isArray(a) && a.length === z.answers.length){ z.answers = a.map(x => String(x || '')); n += a.filter(x => String(x || '').trim()).length; }
  });
  if(n) draftMsg = '📌 已接續上次暫存的作答（' + n + ' 題），繼續做完再送出成績。';
}
document.addEventListener('click', e => { if(e.target.closest('#draftSave')) saveDraft(true); });
window.addEventListener('pagehide', () => { if(QUIZ_DEF.some(d => QZ[d.id].status === 'open' && QZ[d.id].answers.some(a => String(a).trim()))) saveDraft(false); });

function showWho(){ const n = student(); $('#who').textContent = n ? '登入者：' + n + '（成績與點數自動記錄）' : '尚未登入，成績不會記錄'; }

function init(){
  document.title = '圖解單字｜' + T.title + ' ' + T.titleEn;
  $('#h1').textContent = T.emoji + ' ' + T.title + '　' + T.titleEn;
  $('#sub').textContent = '共 ' + T.words.length + ' 個單字・1 段情境對話・3 種測驗';
  if(T.scene) tab = 'scene';
  buildQuizzes(); restoreDraft(); renderTabs(); renderView(); showWho(); setInterval(showWho, 1500);
}
const s = document.createElement('script');
s.src = 'topics/' + encodeURIComponent(tid) + '.js';
s.onload = () => { T = window.TOPIC; init(); };
s.onerror = () => { $('#h1').textContent = '找不到這個主題'; };
document.head.appendChild(s);
</script>
<script src="points.js"></script>
</body>
